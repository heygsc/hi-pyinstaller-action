name: Build and Release macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install PyInstaller
      run: pip install pyinstaller
        
    - name: Build application
      run: |
        pyinstaller hello.py --onedir --noconfirm --clean
        ls -la dist/

    - name: Get current date (Beijing Time)
      id: get-date
      run: |
        DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M%S')
        echo "date=${DATE}" >> $GITHUB_OUTPUT
        
    - name: Zip the application bundle
      run: |
        cd dist
        zip -r hello_macos_${{ steps.get-date.outputs.date }}.zip hello/
        ls -la

    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: dist/hello_macos_${{ steps.get-date.outputs.date }}.zip
        tag_name: v${{ steps.get-date.outputs.date }}
        name: "macOS Build ${{ steps.get-date.outputs.date }}"
        body: "Automated PyInstaller build for macOS (onedir mode)"
