name: Build and Release Multi-Platform App

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install PyInstaller
      run: pip install pyinstaller
        
    - name: Build application
      run: |
        pyinstaller hello.py --onedir --noconfirm --clean
        ls -la dist/

    - name: Get current date (Beijing Time)
      id: get-date
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          DATE=$(python -c "import time; print(time.strftime('%Y%m%d%H%M%S', time.localtime(time.time()+8 * 3600)))")
        else
          DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M%S')
        fi
        echo "date=${DATE}" >> $GITHUB_OUTPUT
        
    - name: Package the application
      run: |
        cd dist
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          7z a hello_win_${{ steps.get-date.outputs.date }}.zip hello/
        else
          zip -r hello_macos_${{ steps.get-date.outputs.date }}.zip hello/
        fi
        ls -la

    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: dist/hello_${{ runner.os }}_${{ steps.get-date.outputs.date }}.zip
        tag_name: v${{ steps.get-date.outputs.date }}
        name: "${{ runner.os }} Build ${{ steps.get-date.outputs.date }}"
        body: "Automated PyInstaller build for ${{ runner.os }} (onedir mode)"
