name: test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install PyInstaller
      run: pip install pyinstaller==5.13.0
        
    - name: Build application
      run: pyinstaller hello.py --onedir --noconfirm --clean

    - name: Zip the application bundle
      run: |
        cd dist
        zip -r hello_macos_$(date -u +'%Y%m%d%H%M%S').zip hello/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: dist/hello_macos_*.zip
        tag_name: v$(date -u +'%Y%m%d%H%M%S')
        name: "macOS Build $(date -u +'%Y%m%d%H%M%S')"
        body: "Automated PyInstaller build for macOS (onedir mode)"
